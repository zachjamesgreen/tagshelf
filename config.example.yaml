# tagshelf configuration
# Copy to config.yaml in the folder you start tagshelf from, or to
# %APPDATA%\tagshelf\config.yaml to use it from any folder, and adjust.
# Command-line flags override these values. A path may start with ~, your home folder.
# Set source and destination to the same path to reorganize an existing library.
# A key tagshelf does not know stops the run, so a misspelt dry_run is never ignored.
source: "D:\\Incoming"                 # folder to organize
destination: "D:\\Music"               # organized library
#untagged: "D:\\Music\\_Untagged"      # audio without usable tags (default: <destination>/_Untagged)
#other: "D:\\Music\\_Other"            # non-audio files that don't belong to a tagged album (default: <destination>/_Other)
#duplicates: "D:\\Music\\_Duplicates"  # copies set aside as duplicates; tagshelf never deletes them (default: <destination>/_Duplicates)
auto_resolve_exact: true               # runs keep the best of identical copies they bring in and set the rest aside
compilations: "Various Artists"        # artist folder for Various Artists compilations
workers: 0                             # 0 = number of CPUs
dry_run: true                          # preview only; set to false to move files
verbose: false
cue_rewrite: true                      # fix FILE lines in moved .cue files (keeps album.cue.orig)
#musicbrainz_contact: "you@example.com" # email or URL MusicBrainz can reach you at; lookups are disabled until set
genre_from_musicbrainz: fill           # the genre of a MusicBrainz match: fill a file that has none, replace it always, or off
cover_art_file: false                  # write a cover file into an album folder that has no cover (after a match, and by tagshelf art)
cover_art_replace: never               # a cover an album has is replaced by the Cover Art Archive's: never, when it is smaller, or always
#database: "C:\\tagshelf\\music.db"     # run history database (default: %LOCALAPPDATA%\tagshelf\libraries\<library-id>\tagshelf.db)
