name: Release

# Started by hand from the Actions tab. It tests main, builds a download of
# tagshelf for each system with the version typed, runs the Linux one on the
# major distributions, and makes a draft release with the downloads attached.
# Nothing is public until the draft is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as vMAJOR.MINOR.PATCH (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version like v0.1.0"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not from $GITHUB_REF"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release named $VERSION exists already"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::A tag named $VERSION exists already"
            exit 1
          fi

  build:
    # Each download is built, tested and run on the kind of machine it is
    # for, so that none is published that was never started.
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: windows-amd64
            os: windows-latest
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check and test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -count=1 -timeout 10m

      # The key of the tagshelf application at AcoustID, which identifying
      # files by their sound asks with. It is a repository secret, so that the
      # repository does not hold it; a download without it could not identify
      # anything, so there is no release without it.
      - name: Build
        env:
          CGO_ENABLED: "0"
          ACOUSTID_CLIENT_KEY: ${{ secrets.ACOUSTID_CLIENT_KEY }}
        run: |
          if [ -z "$ACOUSTID_CLIENT_KEY" ]; then
            echo "::error::The repository secret ACOUSTID_CLIENT_KEY is not set. Register an application at https://acoustid.org/new-application and add its API key under Settings > Secrets and variables > Actions."
            exit 1
          fi
          exe=tagshelf
          if [ "$RUNNER_OS" = "Windows" ]; then exe=tagshelf.exe; fi
          if [ "$(go env GOOS)-$(go env GOARCH)" != "${{ matrix.target }}" ]; then
            echo "::error::This runner builds $(go env GOOS)-$(go env GOARCH), not ${{ matrix.target }}"
            exit 1
          fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/zachjamesgreen/tagshelf/internal/version.release=$VERSION -X github.com/zachjamesgreen/tagshelf/internal/acoustid.releaseKey=$ACOUSTID_CLIENT_KEY" \
            -o "dist/$exe" .
          if ! grep -qaF -- "$ACOUSTID_CLIENT_KEY" "dist/$exe"; then
            echo "::error::The build does not carry the AcoustID key"
            exit 1
          fi
          got=$("./dist/$exe" -version)
          echo "$got"
          if [ "$got" != "tagshelf $VERSION" ]; then
            echo "::error::The program says '$got', not 'tagshelf $VERSION'"
            exit 1
          fi

      - name: Package
        run: |
          name="tagshelf-$VERSION-${{ matrix.target }}"
          go run ./internal/notices
          git diff --exit-code -- THIRD_PARTY_NOTICES
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp README.md LICENSE THIRD_PARTY_NOTICES config.example.yaml dist/
            (cd dist && 7z a -tzip "../$name.zip" tagshelf.exe README.md LICENSE THIRD_PARTY_NOTICES config.example.yaml)
            archive="$name.zip"
          else
            # A tar file unpacks where it is, so it holds one folder. The
            # example config is the one whose paths Linux can read.
            mkdir "$name"
            cp dist/tagshelf README.md LICENSE THIRD_PARTY_NOTICES "$name/"
            cp config.example.linux.yaml "$name/config.example.yaml"
            chmod 755 "$name/tagshelf"
            tar -czf "$name.tar.gz" --owner=0 --group=0 "$name"
            archive="$name.tar.gz"
          fi
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"
          mkdir out
          mv "$archive" "$archive.sha256" out/

      - uses: actions/upload-artifact@v7
        with:
          name: download-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  distros:
    name: Run on Linux distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: download-linux-amd64
          path: out

      - name: Run the download on each distribution
        run: |
          name="tagshelf-$VERSION-linux-amd64"
          (cd out && sha256sum -c "$name.tar.gz.sha256")
          tar -xzf "out/$name.tar.gz"
          .github/scripts/distros.sh "$name/tagshelf" "$VERSION"

  release:
    name: Draft the release
    needs: [build, distros]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: download-*
          merge-multiple: true
          path: out

      - name: Draft the release
        run: |
          ls -l out
          (cd out && sha256sum -c ./*.sha256)
          gh release create "$VERSION" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "tagshelf $VERSION" \
            --generate-notes \
            --draft
          echo "Draft release $VERSION is ready to read and publish:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
