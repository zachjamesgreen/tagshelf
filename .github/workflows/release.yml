name: Release

# Started by hand from the Actions tab. It tests main, builds tagshelf.exe
# with the version typed, and makes a draft release with the download
# attached. Nothing is public until the draft is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as vMAJOR.MINOR.PATCH (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and draft the release
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version like v0.1.0"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not from $GITHUB_REF"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release named $VERSION exists already"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::A tag named $VERSION exists already"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check and test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -count=1 -timeout 10m

      - name: Build tagshelf.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/zachjamesgreen/tagshelf/internal/version.release=$VERSION" \
            -o dist/tagshelf.exe .
          got=$(./dist/tagshelf.exe -version)
          echo "$got"
          if [ "$got" != "tagshelf $VERSION" ]; then
            echo "::error::The exe says '$got', not 'tagshelf $VERSION'"
            exit 1
          fi

      - name: Package
        id: package
        run: |
          name="tagshelf-$VERSION-windows-amd64"
          go run ./internal/notices
          cp README.md LICENSE THIRD_PARTY_NOTICES config.example.yaml dist/
          (cd dist && 7z a -tzip "../$name.zip" tagshelf.exe README.md LICENSE THIRD_PARTY_NOTICES config.example.yaml)
          sha256sum "$name.zip" > "$name.zip.sha256"
          cat "$name.zip.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Draft the release
        run: |
          gh release create "$VERSION" \
            "${{ steps.package.outputs.name }}.zip" \
            "${{ steps.package.outputs.name }}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "tagshelf $VERSION" \
            --generate-notes \
            --draft
          echo "Draft release $VERSION is ready to read and publish:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
