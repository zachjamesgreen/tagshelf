name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Every system tagshelf is released for, or is about to be. The arm64 leg
    # is not only a build: the tag reader runs through a compiler that is
    # different code there.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux amd64
            os: ubuntu-latest
          - name: Linux arm64
            os: ubuntu-24.04-arm
    name: Build, check and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      # The notices list what the builds for all the release targets link,
      # and come out the same on whatever system makes them.
      - name: Third-party notices are up to date
        run: |
          go run ./internal/notices
          git diff --exit-code -- THIRD_PARTY_NOTICES || {
            echo "THIRD_PARTY_NOTICES is out of date: run 'go run ./internal/notices' and commit the result."
            exit 1
          }

      - name: Test
        run: go test ./... -count=1 -timeout 10m

  distros:
    # The Linux build is static, so one binary should run on every
    # distribution: this runs it on the major ones. It is not a check a merge
    # waits for, because it can fail for no fault of the change, when an
    # image has moved on or the registry is down. A release does wait for it.
    name: Run on Linux distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o build/tagshelf .

      - name: Run it on each distribution
        run: .github/scripts/distros.sh build/tagshelf
